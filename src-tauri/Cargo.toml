[package]
name = "trmnl"
version = "0.1.0"
description = "TRMNL — a TRON-inspired terminal for macOS"
authors = ["Matthew Crigger"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "trmnl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
parking_lot = "0.12"
anyhow = "1"
sysinfo = "0.33"
tauri-plugin-opener = "2.5.4"
tauri-plugin-notification = "2.0.0-rc.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
